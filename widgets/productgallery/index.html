<!DOCTYPE html>
<html>
<body>

<script>
    window.ReactEdgeSignals = window.ReactEdgeSignals || {
        emit: (selection) => {
            window.dispatchEvent(
                new CustomEvent("reactedge:signal", { detail: selection })
            );
        }
    };
</script>

<script type="module">
    import { mount } from './api/runtime-widget.tsx';
    import { ResourceLoader } from "@reactedge/framework/contract";

    const loader = new ResourceLoader();
    const contract = await loader.loadContract("default.json");
    const runtime = await loader.loadRuntime();

    const element = document.querySelector('productgallery-widget');

    await requestAnimationFrame(() => {
        mount(element, contract, runtime);
    })
</script>

<div style="padding:20px; border:1px solid #ccc; margin-top:20px;">
    <h3>Intent Debug Panel</h3>

    <!-- 50: blue, 57: purple-->
    <button onclick="ReactEdgeSignals.emit({ type: 'product_attribute_changed', code: 'color', value: '57' })">
        Simulate Color Orange (value=57)
    </button>
</div>

<div style="width: 800px">
    <productgallery-widget></productgallery-widget>
</div>

</body>
</html>
